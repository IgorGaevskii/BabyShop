<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Зміна пароля</title>
	<link rel="stylesheet" href="../css/registration.css">
</head>
	<body>
		<main class="content">
			<h2 class="header-name">Зміна пароля</h2>
			<div class="wrapper-form">
				<form name="forgotPassword">
					<label class="name-field email">E-mail</label>
					<input 
						type="email"
						name="email_user"
						class="field-registration"
						autocomplete="off"
						required
					>
					<label class="name-field password">Новий пароль</label>
					<div class="wrap-field-password">
						<input
							type="password" 
							name="password_user"
							class="field-password"
							autocomplete="off"
						>
						<div class="eye-switch">
							<img src="/pictures/icon show.png" alt="show password" width="18" height="18">
						</div>
					</div>
					<label class="name-field repeatPassword">Повторіть пароль</label>
					<input
						type="password"
						name="repeatPassword"
						class="field-registration"
						autocomplete="off"
						required
					>
				</form>
				<div class="vertical_stripe"></div>
				<div class="description"></div>
			</div>
			<button id="but-forgot_password">Змінити</button>
		</main>

		<section class="modal popup hide">
			<div class="window popup-window">
				<p class="message"></p>
				<button class="but-window">ok</button>
			</div>
		</section>
		<script type="module" src="../js/forgot_password.js"></script>
	</body>
</html>
