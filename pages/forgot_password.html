<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Зміна пароля</title>
	<link rel="stylesheet" href="../css/move_one.css">
</head>
	<body>
		<main class="content">
			<h2 class="content-header">Зміна пароля</h2>
			<form class="content-form" name="forgotPassword">
				<label class="name-field email">E-mail</label>
				<input 
					type="email"
					name="email"
					class="field-registration"
					autocomplete="off"
					required
				>
				<label class="name-field password">Новий пароль</label>
				<div class="wrap-field-password">
					<input
						type="password" 
						name="password_user"
						class="field-password"
						autocomplete="off"
					>
					<div class="eye-switch">
						<img src="/pictures/icon show.png" alt="show password" width="18" height="18">
					</div>
				</div>
				<label class="name-field repeatPassword">Повторіть пароль</label>
				<input
					type="password"
					name="repeatPassword"
					class="field-registration"
					autocomplete="off"
					required
				>
				<button id="but-forgot_password" class="small-but">Змінити</button>
			</form>
		</main>

		<section class="popup hide">
			<div class="popup-content">
				<p class="popup-message"></p>
				<a href="http://babyshop.local">
					<button class="small-but">ок</button>
				</a>
				<!-- <a href="http://babystore.website">
					<button class="small-but">ок</button>
				</a> -->
			</div>
		</section>

		<script type="module" src="../js/forgot_password.js"></script>
	</body>
</html>
